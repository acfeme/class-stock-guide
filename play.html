<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 반 증권거래소 · 시연 영상</title>
<style>
/* 부스 TV용 반복 재생기: [반복 재생]을 누르면 [멈춤]을 누를 때까지 처음부터 계속 다시 재생 */
:root { --ink: #0a0f1f; --panel: #121a30; --line: #222c48; --fg: #edf0f8; --dim: #8b94ad; --gold: #ffd43b; --red: #e03131; --navy: #1f3a8a; }
* { box-sizing: border-box; margin: 0; }
[hidden] { display: none !important; }
html, body { height: 100%; background: #000; color: var(--fg); font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif; overflow: hidden; }
video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
#start { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(900px 500px at 70% 20%, #1c2c66, transparent 70%), var(--ink); text-align: center; z-index: 5; }
#start h1 { font-size: clamp(36px, 6vw, 80px); font-weight: 900; letter-spacing: -.02em; }
#start h1 span { color: var(--gold); }
#start p { color: var(--dim); font-size: clamp(18px, 2vw, 26px); margin-top: 14px; }
.big { margin-top: 44px; font: inherit; font-size: clamp(24px, 3vw, 38px); font-weight: 800; color: var(--ink); background: var(--gold); border: 0; border-radius: 999px; padding: 22px 56px; cursor: pointer; box-shadow: 0 16px 40px rgba(255,212,59,.3); }
.big:hover { transform: translateY(-2px); }
#bar { position: fixed; left: 50%; top: 24px; transform: translateX(-50%); display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 999px; background: rgba(10,15,31,.88); border: 1px solid var(--line); z-index: 6; transition: opacity .4s; }
#bar.hide { opacity: 0; pointer-events: none; }
#bar button { font: inherit; font-size: 20px; font-weight: 800; border: 0; border-radius: 999px; padding: 12px 26px; cursor: pointer; color: #fff; background: var(--panel); white-space: nowrap; flex: none; }
#bar { width: max-content; max-width: calc(100vw - 32px); }
#bar #stop { background: var(--red); }
#bar #loopState { font-size: 17px; color: var(--gold); padding: 0 10px; white-space: nowrap; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
</style>
</head>
<body>
<video id="v" src="demo.mp4" playsinline preload="auto"></video>

<div id="start">
  <div>
    <h1>우리 반 <span>증권거래소</span></h1>
    <p>시연 영상 · 1분 38초</p>
    <button class="big" id="go" type="button">▶ 반복 재생 시작</button>
    <p style="font-size:17px;margin-top:18px">[멈춤]을 누를 때까지 처음부터 계속 다시 재생해요 · 스페이스바: 멈춤/이어서 재생 · Home 키: 처음부터</p>
  </div>
</div>

<div id="bar" hidden>
  <span id="loopState">🔁 반복 재생 중</span>
  <button id="full" type="button">⛶ 전체 화면</button>
  <button id="restart" type="button">⏮ 처음부터</button>
  <button id="stop" type="button">■ 멈춤</button>
</div>

<script>
(() => {
  const v = document.getElementById('v'), start = document.getElementById('start'), bar = document.getElementById('bar');
  const go = document.getElementById('go'), stop = document.getElementById('stop'), full = document.getElementById('full'), state = document.getElementById('loopState');
  let playing = false, hideTimer = null, wake = null;

  async function keepAwake(on) {
    try {
      if (on && 'wakeLock' in navigator) wake = await navigator.wakeLock.request('screen');
      else if (!on && wake) { await wake.release(); wake = null; }
    } catch (_) {}
  }
  function showBar() {
    bar.classList.remove('hide');
    clearTimeout(hideTimer);
    if (playing) hideTimer = setTimeout(() => bar.classList.add('hide'), 2500);
  }
  async function play() {
    v.loop = true;
    try { await v.play(); } catch (_) { v.muted = true; await v.play().catch(() => {}); }
    playing = true;
    start.hidden = true; bar.hidden = false;
    state.textContent = v.muted ? '🔁 반복 재생 중 (소리 꺼짐)' : '🔁 반복 재생 중';
    stop.textContent = '■ 멈춤';
    keepAwake(true); showBar();
  }
  function pause() {
    v.pause(); playing = false;
    state.textContent = '⏸ 멈춤';
    stop.textContent = '▶ 다시 반복 재생';
    keepAwake(false); showBar();
  }
  go.addEventListener('click', () => { document.documentElement.requestFullscreen?.().catch(() => {}); play(); });
  stop.addEventListener('click', () => (playing ? pause() : play()));
  // 처음부터: 멈춰 있어도 0초로 돌아가 바로 반복 재생
  document.getElementById('restart').addEventListener('click', () => { v.currentTime = 0; play(); });
  full.addEventListener('click', () => (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.().catch(() => {})));
  // loop 속성이 무시되는 경우를 대비해 끝나면 직접 처음부터
  v.addEventListener('ended', () => { if (playing) { v.currentTime = 0; v.play().catch(() => {}); } });
  document.addEventListener('mousemove', showBar);
  document.addEventListener('touchstart', showBar);
  document.addEventListener('keydown', (e) => {
    if (start.hidden === false) return;
    if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
    if (e.code === 'Home') { e.preventDefault(); v.currentTime = 0; play(); }
  });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && playing) keepAwake(true); });
  v.addEventListener('error', () => { start.querySelector('p').textContent = '영상 파일(시연영상.mp4)을 찾지 못했어요. 이 파일과 같은 폴더에 있어야 해요.'; });
})();
</script>
</body>
</html>
